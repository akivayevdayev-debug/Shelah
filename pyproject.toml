# Vercel reads this file; nothing else in the repo does.
#
# Why it exists: with no entry point named, Vercel auto-detects the Flask
# `app` in app.py and serves it on its own, skipping asgi.py (the rate
# limiter, the ASGI body cap and security headers, the FastAPI /ask).
# [tool.vercel] names api/index.py, which re-exports asgi.app with Flask
# mounted inside it.
#
# Once this file exists Vercel installs [project].dependencies instead of
# requirements.txt, so the list below repeats requirements.txt's pins
# exactly. requirements.txt stays the file to edit (it carries the reasons
# for each pin); tests/test_api_index_entrypoint.py fails if the two differ.
# Lint settings stay in ruff.toml and test settings in pytest.ini.
[project]
name = "shelah"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "flask==3.1.3",
    "fastapi==0.163.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "a2wsgi==1.10.10",
    "redis==8.1.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "httpx==0.28.1",
    "pyluach==2.3.0",
    "tzdata==2026.6",
    "timezonefinder==9.2.0",
    "zmanim==0.3.1",
    "anthropic==2.8.0",
    "google-genai==2.34.0",
    "tenacity==9.1.4",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "supabase==2.34.1",
    "python-docx==1.2.0",
    "reportlab==5.1.0",
    "sentry-sdk==2.75.0",
]

[tool.vercel]
entrypoint = "api.index:app"
