# Keeps a production instance loaded so visitors rarely land on a cold start.
#
# A new instance spends 6-8 s importing the app before it can answer
# (docs/COLD_START_2026-11-23.md). Vercel keeps an instance for a while after
# its last request, so a request every few minutes keeps one ready during
# quiet hours. The health route is uncached (Cache-Control: no-store), so each
# ping reaches the function, and it does no work beyond returning a small
# JSON body. GitHub may run a schedule late when its runners are busy; a late
# ping only means an occasional cold start, as before.
name: Keep warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Request the health route
        run: >
          curl --silent --show-error --fail --max-time 60
          --output /dev/null
          --write-out "status %{http_code}, %{time_total} s\n"
          https://shelah.org/api/async/health
