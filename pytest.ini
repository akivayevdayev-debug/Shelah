[pytest]
testpaths = tests
asyncio_mode = auto
# -p no:respx: respx's auto-loaded plugin imports httpx before conftest.py can
# alias it to httpx2 (see the top of tests/conftest.py). No test uses its fixture.
# Coverage target is backend/ only — app.py is a 5k-line migration candidate, not the unit target.
# Threshold ratcheted 60->85 (actual measured ~91%); floor leaves headroom for normal fluctuation
# without being stale. Raise again as coverage grows — do not lower it.
addopts = -p no:respx --cov=backend --cov-report=term-missing --cov-fail-under=85 -ra
